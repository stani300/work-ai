<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Work AI</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #0b1220;
				--panel: #111827;
				--border: #243044;
				--text: #e5eefb;
				--muted: #94a3b8;
				--accent: #f6821f;
				--user: #1d4ed8;
				--assistant: #1f2937;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				font-family: Inter, system-ui, sans-serif;
				background: linear-gradient(180deg, #0b1220 0%, #111827 100%);
				color: var(--text);
				min-height: 100vh;
			}

			.app {
				max-width: 900px;
				margin: 0 auto;
				min-height: 100vh;
				display: grid;
				grid-template-rows: auto 1fr auto;
				padding: 24px;
				gap: 16px;
			}

			header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
			}

			header h1 {
				margin: 0;
				font-size: 1.5rem;
			}

			header p {
				margin: 4px 0 0;
				color: var(--muted);
				font-size: 0.95rem;
			}

			.badge {
				background: rgba(246, 130, 31, 0.15);
				color: #ffb86a;
				border: 1px solid rgba(246, 130, 31, 0.35);
				padding: 8px 12px;
				border-radius: 999px;
				font-size: 0.85rem;
				white-space: nowrap;
			}

			#chat {
				background: rgba(17, 24, 39, 0.85);
				border: 1px solid var(--border);
				border-radius: 16px;
				padding: 16px;
				overflow-y: auto;
				display: flex;
				flex-direction: column;
				gap: 12px;
			}

			.message {
				max-width: 85%;
				padding: 12px 14px;
				border-radius: 14px;
				line-height: 1.5;
				white-space: pre-wrap;
			}

			.message.user {
				align-self: flex-end;
				background: var(--user);
			}

			.message.assistant {
				align-self: flex-start;
				background: var(--assistant);
				border: 1px solid var(--border);
			}

			.message.system {
				align-self: center;
				background: transparent;
				color: var(--muted);
				font-size: 0.9rem;
				padding: 0;
			}

			form {
				display: grid;
				grid-template-columns: 1fr auto;
				gap: 12px;
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 16px;
				padding: 12px;
			}

			textarea {
				resize: vertical;
				min-height: 56px;
				max-height: 180px;
				border: none;
				background: transparent;
				color: var(--text);
				font: inherit;
				padding: 8px;
				outline: none;
			}

			button {
				border: none;
				border-radius: 12px;
				background: var(--accent);
				color: #111;
				font-weight: 700;
				padding: 0 18px;
				cursor: pointer;
			}

			button:disabled {
				opacity: 0.6;
				cursor: not-allowed;
			}
		</style>
	</head>
	<body>
		<div class="app">
			<header>
				<div>
					<h1>Work AI</h1>
					<p>Your workplace assistant, powered by Cloudflare Workers AI.</p>
				</div>
				<div class="badge">Cloudflare Edge</div>
			</header>

			<div id="chat">
				<div class="message system">Ask me to draft an email, summarize notes, or help plan your work.</div>
			</div>

			<form id="form">
				<textarea id="input" placeholder="Ask Work AI anything..." required></textarea>
				<button id="send" type="submit">Send</button>
			</form>
		</div>

		<script>
			const chat = document.getElementById("chat");
			const form = document.getElementById("form");
			const input = document.getElementById("input");
			const send = document.getElementById("send");
			const history = [];

			function addMessage(role, content) {
				const el = document.createElement("div");
				el.className = `message ${role}`;
				el.textContent = content;
				chat.appendChild(el);
				chat.scrollTop = chat.scrollHeight;
			}

			form.addEventListener("submit", async (event) => {
				event.preventDefault();
				const message = input.value.trim();
				if (!message) return;

				addMessage("user", message);
				history.push({ role: "user", content: message });
				input.value = "";
				send.disabled = true;

				try {
					const response = await fetch("/api/chat", {
						method: "POST",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify({ message, history }),
					});

					const data = await response.json();
					if (!response.ok) {
						throw new Error(data.error || "Request failed");
					}

					addMessage("assistant", data.reply);
					history.push({ role: "assistant", content: data.reply });
				} catch (error) {
					addMessage("assistant", `Error: ${error.message}`);
				} finally {
					send.disabled = false;
					input.focus();
				}
			});
		</script>
	</body>
</html>
